# EKF-SLAM Parameters
# Configuration for the custom Extended Kalman Filter SLAM implementation

ekf_slam_node:
  ros__parameters:
    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    
    # Topic names
    scan_topic: "/scan"
    odom_topic: "/odom"
    
    # Map parameters
    map_resolution: 0.05       # meters per cell (5cm)
    map_size: 30.0             # initial map size in meters
    map_publish_rate: 1.0      # Hz
    
    # Pose estimation
    pose_publish_rate: 10.0    # Hz
    
    # Scan matching
    use_scan_matching: true    # Enable ICP-based scan matching for drift correction
    
    # EKF motion model noise (alpha parameters)
    # Higher values = more uncertainty in motion
    motion_noise_alpha1: 0.1   # rotation -> rotation noise
    motion_noise_alpha2: 0.01  # translation -> rotation noise
    motion_noise_alpha3: 0.01  # translation -> translation noise  
    motion_noise_alpha4: 0.1   # rotation -> translation noise
    
    # Measurement noise
    scan_match_noise_x: 0.02   # meters
    scan_match_noise_y: 0.02   # meters
    scan_match_noise_theta: 0.01  # radians
